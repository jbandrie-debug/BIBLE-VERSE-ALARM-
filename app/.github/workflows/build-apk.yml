name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: |
          mkdir -p app
          cat << 'GSEOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project-id",
              "storage_bucket": "dummy-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.kirkatic.bibleversealarm"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForGoogleServicesJson" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.aistudio.bibleversealarm.qkxpr"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForGoogleServicesJson" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567892",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForGoogleServicesJson" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567893",
                  "android_client_info": {
                    "package_name": "com.example.bibleversealarm"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForGoogleServicesJson" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          GSEOF
          cp app/google-services.json google-services.json || true

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/outputs/apk/debug/*.apk"
